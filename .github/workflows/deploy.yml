name: Test, build and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build image
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA}" -t subnet-calculator:test .

      - name: Smoke test the container
        run: |
          docker run -d --name subnet-test -p 8080:8080 subnet-calculator:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              curl --fail --silent http://127.0.0.1:8080/api/version | grep -q "${GITHUB_SHA}"
              exit 0
            fi
            sleep 1
          done
          docker logs subnet-test
          exit 1

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish commit image and latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -eu
          image="${REGISTRY}/${REPOSITORY}"
          docker tag subnet-calculator:test "${image}:${GITHUB_SHA}"
          docker tag subnet-calculator:test "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

      - name: Verify automatic cloud deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_RUNNER_URL != ''
        env:
          APP_RUNNER_URL: ${{ vars.APP_RUNNER_URL }}
        run: |
          for attempt in $(seq 1 60); do
            response=$(curl --max-time 10 --fail --silent "${APP_RUNNER_URL%/}/api/version" || true)
            if echo "$response" | grep -q "${GITHUB_SHA}"; then
              echo "App Runner is serving commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "App Runner did not serve commit ${GITHUB_SHA} within 10 minutes"
          exit 1
